<!doctype html>
<!-- The social preview card, 1200x630. build.sh screenshots this page; the
     markers and senders are the hero's, so the card promises what the page
     shows. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Newsreader"; src: url("newsreader-var.woff2") format("woff2"); font-weight: 200 800; }
:root { --bg:#090D16; --ink:#E9EEF5; --dim:#A8B4C4; --faint:#808E9F; --faintest:#62707F;
  --accent:#4E9BEA; --accent-ink:#82BAF5; --warn:#E8AC4C; --danger:#FF7A68;
  --serif:"Newsreader", Georgia, serif; --mono:ui-monospace, "SF Mono", Menlo, monospace; }
html, body { margin:0; width:1200px; height:630px; overflow:hidden; background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; }
canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
.grat { position:absolute; inset:0;
  background-image: repeating-linear-gradient(90deg, rgba(130,186,245,.07) 0 1px, transparent 1px 10%),
    repeating-linear-gradient(180deg, rgba(130,186,245,.07) 0 1px, transparent 1px 12.5%);
  -webkit-mask-image: radial-gradient(ellipse 70% 50% at 50% 85%, #000 20%, transparent 85%); }
.scrim { position:absolute; inset:0;
  background: linear-gradient(180deg, rgba(9,13,22,.9) 0%, rgba(9,13,22,.7) 55%, rgba(9,13,22,0) 72%); }
.mkr { position:absolute; transform:translate(-50%, calc(-100% - 14px)); font:600 13px/1 var(--mono);
  color:var(--accent-ink); display:flex; flex-direction:column; align-items:center; gap:4px; }
.mkr::after { content:""; border:6px solid transparent; border-top:7px solid var(--accent); border-bottom:0; }
.brand { position:absolute; left:64px; top:52px; display:flex; align-items:center; gap:14px; }
.brand img { width:46px; }
.brand span { font-family:var(--serif); font-size:28px; font-weight:500; }
.url { position:absolute; right:64px; top:62px; font:500 17px/1 var(--mono); letter-spacing:.06em; color:var(--faint); }
h1 { position:absolute; left:64px; top:140px; margin:0; font-family:var(--serif); font-weight:500;
  font-size:70px; line-height:1.02; letter-spacing:-0.012em; }
h1 em { font-style:normal; color:var(--accent-ink); }
.mkrs { position:absolute; right:64px; top:140px; width:430px; font:500 19px/1.2 var(--mono); color:var(--dim);
  border:1px solid rgba(130,186,245,.22); border-radius:12px; background:rgba(9,13,22,.72); }
.mkrs div { display:grid; grid-template-columns:2rem 1fr auto; gap:.8rem; padding:.95rem 1.2rem;
  border-top:1px solid rgba(130,186,245,.1); }
.mkrs div:first-child { border-top:0; font-size:12px; letter-spacing:.1em; color:var(--faintest); }
.mkrs b { color:var(--accent-ink); font-weight:600; }
.mkrs .late { color:var(--danger); } .mkrs .soon { color:var(--warn); }
</style></head>
<body>
  <canvas></canvas>
  <div class="grat"></div>
  <span class="mkr">1</span><span class="mkr">2</span><span class="mkr">3</span>
  <div class="scrim"></div>
  <div class="brand"><img src="mark.svg"><span>passband</span></div>
  <span class="url">passband.app</span>
  <h1>4,312 emails.<br><em>Three</em> need you.</h1>
  <div class="mkrs">
    <div><span>MKR</span><span>SENDER</span><span>STATUS</span></div>
    <div><b>1</b><span>Parkline Properties</span><span class="late">past due</span></div>
    <div><b>2</b><span>Dr. Ortiz's Office</span><span class="soon">today</span></div>
    <div><b>3</b><span>Jamie Chen</span><span class="soon">due Fri</span></div>
  </div>
  <script src="card.js"></script>
</body></html>
