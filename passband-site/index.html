<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Passband</title>
    <meta name="description" content="Passband brings the important things forward, so you can give them your attention and get on with your day. For Gmail, on Mac and iPhone." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Passband" />
    <meta property="og:title" content="Passband" />
    <meta property="og:description" content="Passband brings the important things forward, so you can give them your attention and get on with your day. For Gmail, on Mac and iPhone." />
    <meta property="og:url" content="https://passband.app/" />
    <meta property="og:image" content="https://passband.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="4,312 emails. Three need you. Passband, over a spectrum analyzer with three marked peaks." />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/icon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/icon-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link
      rel="preload"
      href="/newsreader-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      body {
        margin: 0;
        background: #090D16;
      }
      /* Newsreader, subset from the same variable TTF the Swift client
         bundles, so the wordmark is the same letterforms in the app and on
         the web. Declared here rather than in the bundle so the preload above
         can start the download before React has even parsed. */
      @font-face {
        font-family: "Newsreader";
        src: url("/newsreader-var.woff2") format("woff2");
        font-weight: 200 800;
        font-style: normal;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
